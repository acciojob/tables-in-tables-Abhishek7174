<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      .html-cell {
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <table style="width: 100%; height: 100%">
      <!-- Your code here -->

      <tr>
        <td>
          <!-- Nested Table 1 -->
          <table>
            <tr>
              <th colspan="2">Nested Table 1</th>
            </tr>
            <tr>
              <td>Row 1</td>
              <td class="html-cell">HTML</td>
            </tr>
            <tr>
              <td>Row 2</td>
              <td>Data 2</td>
            </tr>
          </table>
        </td>

        <td>
          <!-- Nested Table 2 -->
          <table>
            <tr>
              <th>Nested Table 2</th>
              <th>Column 1</th>
              <th>Column 2</th>
            </tr>
            <tr>
              <td>Row 1</td>
              <td>Data A</td>
              <td>Data B</td>
            </tr>
            <tr>
              <td>Row 2</td>
              <td>Data C</td>
              <td>Data D</td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td>
          <!-- Nested Table 3 with list -->
          <table>
            <tr>
              <th>Nested Table 3</th>
            </tr>
            <tr>
              <td>
                <ul>
                  <li>List item 1</li>
                  <li>List item 2</li>
                  <li>List item 3</li>
                </ul>
              </td>
            </tr>
          </table>
        </td>

        <td>
          <!-- Nested Table 4 -->
          <table>
            <tr>
              <th colspan="2">Nested Table 4</th>
            </tr>
            <tr>
              <td>Cell A</td>
              <td>Cell B</td>
            </tr>
            <tr>
              <td>Cell C</td>
              <td>Cell D</td>
            </tr>
          </table>
        </td>
      </tr>

    </table>
  </body>
</html>
